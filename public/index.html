<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism - AI Image & Text Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-gray-800 rounded-2xl p-6 shadow-xl border border-gray-700">
    <h1 class="text-3xl font-bold text-center bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent mb-2">Prism</h1>
    <p class="text-gray-400 text-sm text-center mb-6">AI Image & Text Studio</p>

    <!-- Text Prompt Input -->
    <div class="mb-4">
      <label class="block text-gray-300 text-sm font-medium mb-2">Describe the image you want</label>
      <textarea id="promptInput" rows="3" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white placeholder-gray-400 focus:outline-none focus:border-purple-500" placeholder="A photorealistic red panda sipping coffee..."></textarea>
    </div>

    <!-- Generate Button -->
    <button id="generateBtn" onclick="generateImage()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
      Generate Image
    </button>

    <!-- Error Message Area -->
    <div id="errorMsg" class="hidden mt-4 bg-red-500/10 border border-red-500 text-red-400 p-3 rounded-lg text-sm text-center"></div>

    <!-- Image Result Output -->
    <div class="mt-6 flex flex-col items-center justify-center min-h-[250px] border-2 border-dashed border-gray-700 rounded-xl p-2 bg-gray-900/50">
      <div id="loader" class="hidden animate-spin rounded-full h-8 w-8 border-b-2 border-purple-500 my-8"></div>
      <img id="resultImg" class="hidden rounded-lg w-full max-h-[350px] object-cover" alt="Generated Image" />
      <p id="placeholderText" class="text-gray-500 text-sm">Your generated image will appear here.</p>
    </div>
  </div>

  <script>
    async function generateImage() {
      const prompt = document.getElementById('promptInput').value.trim();
      const btn = document.getElementById('generateBtn');
      const loader = document.getElementById('loader');
      const resultImg = document.getElementById('resultImg');
      const placeholderText = document.getElementById('placeholderText');
      const errorMsg = document.getElementById('errorMsg');

      if (!prompt) {
        alert('Please enter a description!');
        return;
      }

      // UI Reset
      errorMsg.classList.add('hidden');
      resultImg.classList.add('hidden');
      placeholderText.classList.add('hidden');
      loader.classList.remove('hidden');
      btn.disabled = true;
      btn.innerText = 'Generating...';

      try {
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true&seed=${Math.floor(Math.random() * 1000)}`;
        
        // Test Image Loading
        const img = new Image();
        img.src = imageUrl;
        img.onload = () => {
          loader.classList.add('hidden');
          resultImg.src = imageUrl;
          resultImg.classList.remove('hidden');
          btn.disabled = false;
          btn.innerText = 'Generate Image';
        };
        img.onerror = () => {
          throw new Error('Failed to generate image');
        };
      } catch (err) {
        loader.classList.add('hidden');
        placeholderText.classList.remove('hidden');
        errorMsg.innerText = 'Something went wrong while generating the image. Please try again.';
        errorMsg.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = 'Generate Image';
      }
    }
  </script>

  <!-- Adsterra Social Bar Ads -->
  <script src="https://pl30752477.effectivecpmnetwork.com/9e/d6/1a/9ed61a2051a1d0325629627b8a39d95c.js"></script>

</body>
</html>
