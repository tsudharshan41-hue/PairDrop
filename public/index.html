<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism - Free AI Image Studio</title>
  <style>
    body { background-color: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 450px; text-align: center; border: 1px solid #334155; }
    h1 { font-size: 28px; color: #a855f7; margin-bottom: 4px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    textarea { width: 100%; height: 90px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: white; padding: 12px; font-size: 14px; resize: none; margin-bottom: 16px; outline: none; box-sizing: border-box; }
    button { width: 100%; background: linear-gradient(to right, #8b5cf6, #ec4899); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:disabled { opacity: 0.6; }
    .img-box { margin-top: 20px; border: 2px dashed #334155; border-radius: 12px; min-height: 250px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .img-box img { width: 100%; display: none; border-radius: 10px; }
    .error { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }
    .loader { display: none; border: 4px solid #334155; border-top: 4px solid #a855f7; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <h1>Prism</h1>
    <p>AI Image Studio</p>
    <textarea id="prompt" placeholder="Describe the image you want..."></textarea>
    <button id="btn" onclick="genImg()">Generate Image</button>
    <p id="err" class="error">Failed to generate image. Try again.</p>

    <div class="img-box">
      <div id="loader" class="loader"></div>
      <p id="placeholder" style="color: #64748b; font-size: 13px;">Your generated image will appear here.</p>
      <img id="result" alt="AI Result">
    </div>
  </div>

  <script>
    function genImg() {
      var text = document.getElementById('prompt').value.trim();
      var btn = document.getElementById('btn');
      var loader = document.getElementById('loader');
      var img = document.getElementById('result');
      var txt = document.getElementById('placeholder');
      var err = document.getElementById('err');

      if (!text) { alert('Please enter a prompt!'); return; }

      err.style.display = 'none';
      img.style.display = 'none';
      txt.style.display = 'none';
      loader.style.display = 'block';
      btn.disabled = true;
      btn.innerText = 'Generating...';

      var url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(text) + "?width=512&height=512&nologo=true&seed=" + Math.floor(Math.random() * 10000);

      var tempImg = new Image();
      tempImg.src = url;
      tempImg.onload = function() {
        loader.style.display = 'none';
        img.src = url;
        img.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Generate Image';
      };
      tempImg.onerror = function() {
        loader.style.display = 'none';
        txt.style.display = 'block';
        err.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Generate Image';
      };
    }
  </script>

  <!-- Adsterra Social Bar -->
  <script src="https://pl30752477.effectivecpmnetwork.com/9e/d6/1a/9ed61a2051a1d0325629627b8a39d95c.js"></script>

</body>
</html>
